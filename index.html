<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

    <title>Vehicle Details</title>

    <style type="text/css">

        /* =========================================================
           PAGE
           ========================================================= */

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #222222;
        }

        body {
            box-sizing: border-box;
        }

        *,
        *:before,
        *:after {
            box-sizing: border-box;
        }


        /* =========================================================
           MAIN CERTIFICATE CONTAINER
           ========================================================= */

        .cert-container {
            width: calc(100% - 84px);
            margin: 0 42px;
            padding: 0 0 30px 0;
            background-color: #ffffff;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .cert-header {
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #dddddd;
            padding-top: 28px;
            padding-bottom: 25px;
            margin-bottom: 40px;
        }

        .cert-header h2 {
            margin: 0;
            padding: 0;

            color: #2c3e50;

            font-size: 42px;
            line-height: 1.15;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0;

            white-space: nowrap;
        }


        /* =========================================================
           SECTION TITLES
           ========================================================= */

        .section-title {
            width: 100%;

            background-color: #f7f8f9;

            border-left: 6px solid #4285bd;
            border-radius: 6px;

            padding: 19px 24px;

            margin-top: 0;
            margin-bottom: 27px;

            color: #2c3e50;

            font-size: 25px;
            line-height: 1.2;
            font-weight: 600;
        }


        /* =========================================================
           PANEL GRID
           ========================================================= */

        .ui-panelgrid {
            width: 100%;
            margin-bottom: 39px;
        }

        .ui-panelgrid-content {
            width: 100%;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .ui-grid-row {
            width: 100%;
            display: flex;
            flex-wrap: nowrap;

            margin: 0;
            padding: 0;
        }

        .ui-panelgrid-cell {
            min-height: 45px;
            padding: 0 15px;

            display: flex;
            align-items: flex-start;
        }

        /*
         * Four columns:
         * Label      = 25%
         * Value      = 25%
         * Label      = 25%
         * Value      = 25%
         */

        .ui-grid-col-3 {
            width: 25%;
            flex: 0 0 25%;
        }


        /* =========================================================
           GENERAL INFORMATION / FIELD LABELS
           ========================================================= */

        .field-label {
            display: block;

            color: #555555;

            font-size: 25px;
            line-height: 1.25;
            font-weight: 700;

            margin: 0;
            padding: 0;
        }

        .field-value {
            display: block;

            color: #222222;

            font-size: 25px;
            line-height: 1.25;
            font-weight: 500;

            margin: 0;
            padding: 0;
        }


        /* =========================================================
           POLLUTION STATUS
           ========================================================= */

        .puc-status-yes {
            display: block;

            color: #27ae60;

            font-size: 25px;
            line-height: 1.25;
            font-weight: 700;

            margin: 0;
            padding: 0;
        }

        .puc-status-no {
            display: block;

            color: #c0392b;

            font-size: 25px;
            line-height: 1.25;
            font-weight: 700;

            margin: 0;
            padding: 0;
        }


        /* =========================================================
           EMISSION TEST TABLE
           ========================================================= */

        .result-table {
            width: 100%;

            margin: 0;
            padding: 0;

            border-collapse: collapse;
            border-spacing: 0;

            table-layout: fixed;

            font-size: 25px;
        }


        /* ---------------------------------------------------------
           COLUMN WIDTHS
           --------------------------------------------------------- */

        .result-table col.parameter-column {
            width: 40%;
        }

        .result-table col.prescribed-column {
            width: 30%;
        }

        .result-table col.measured-column {
            width: 30%;
        }


        /* ---------------------------------------------------------
           TABLE HEADER
           --------------------------------------------------------- */

        .result-table thead tr {
            height: 72px;
        }

        .result-table th {
            height: 72px;

            padding: 15px 20px;

            background-color: #4285bd;
            color: #ffffff;

            border: 1px solid #d5d5d5;

            text-align: center;
            vertical-align: middle;

            font-size: 25px;
            line-height: 1.2;
            font-weight: 600;
        }


        /* ---------------------------------------------------------
           TABLE BODY
           --------------------------------------------------------- */

        .result-table tbody tr {
            height: 80px;
        }

        .result-table td {
            height: 80px;

            padding: 15px 20px;

            background-color: #ffffff;

            border: 1px solid #d5d5d5;

            color: #333333;

            text-align: center;
            vertical-align: middle;

            font-size: 25px;
            line-height: 1.3;
            font-weight: 400;
        }


        /* ---------------------------------------------------------
           PARAMETER COLUMN
           --------------------------------------------------------- */

        .result-table td.parameter {
            text-align: left;
            padding-left: 30px;
            padding-right: 25px;
        }

        .result-table td.parameter label {
            display: block;

            text-align: left;

            font-size: 25px;
            line-height: 1.25;
            font-weight: 400;
        }


        /* ---------------------------------------------------------
           VALUE COLUMNS
           --------------------------------------------------------- */

        .result-table td.value {
            text-align: center;
            vertical-align: middle;
        }

        .result-table td.value label {
            display: block;

            text-align: center;

            font-size: 25px;
            line-height: 1.2;
            font-weight: 400;
        }


        /* =========================================================
           RESPONSIVE BEHAVIOUR
           ========================================================= */

        @media screen and (max-width: 1100px) {

            .cert-container {
                width: calc(100% - 50px);
                margin: 0 25px;
            }

            .cert-header h2 {
                font-size: 34px;
            }

            .field-label,
            .field-value,
            .puc-status-yes,
            .puc-status-no,
            .result-table,
            .result-table th,
            .result-table td,
            .result-table td.parameter label,
            .result-table td.value label {
                font-size: 20px;
            }

            .section-title {
                font-size: 21px;
            }
        }


        @media screen and (max-width: 700px) {

            .cert-container {
                width: calc(100% - 30px);
                margin: 0 15px;
            }

            .cert-header {
                padding-top: 20px;
                padding-bottom: 18px;
                margin-bottom: 25px;
            }

            .cert-header h2 {
                font-size: 25px;
                white-space: normal;
            }

            .section-title {
                font-size: 18px;
                padding: 14px 18px;
                margin-bottom: 20px;
            }

            .ui-grid-row {
                flex-wrap: wrap;
            }

            .ui-grid-col-3 {
                width: 50%;
                flex: 0 0 50%;
                margin-bottom: 15px;
            }

            .field-label,
            .field-value,
            .puc-status-yes,
            .puc-status-no,
            .result-table,
            .result-table th,
            .result-table td,
            .result-table td.parameter label,
            .result-table td.value label {
                font-size: 15px;
            }

            .result-table th {
                height: 55px;
                padding: 10px;
            }

            .result-table td {
                height: 65px;
                padding: 10px;
            }

            .result-table td.parameter {
                padding-left: 15px;
            }
        }

    </style>

</head>
